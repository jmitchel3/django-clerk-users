[build-system]
build-backend = "hatchling.build"

requires = [ "hatchling" ]

[project]
name = "django-clerk-users"
version = "0.3.4"
description = "Integrate Clerk with Django"
readme = "README.md"
keywords = [ "authentication", "clerk", "django", "jwt", "webhooks" ]
license = "MIT"
authors = [
  { name = "Justin Mitchel" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # clerk-backend-api is deliberately NOT here. It pins cryptography<49, and
  # that pin is what resolvers obey, so a default install would be held to
  # cryptography 48.x. It lives in the [sdk] extra instead.
  "cryptography>=45",
  "django>=4.2,<7",
  # Direct dependency rather than relying on the svix transitive: the thin
  # Clerk client imports httpx itself, and svix is due to be droppable.
  "httpx>=0.27",
  # Session token verification uses PyJWT directly instead of going through
  # clerk-backend-api. Same library the SDK uses, so verification semantics are
  # unchanged; it just stops arriving as an SDK transitive.
  "pyjwt>=2.8",
  "svix>=1",
]

optional-dependencies.drf = [ "djangorestframework>=3.14" ]
# Opt in with: pip install django-clerk-users[sdk]
# Installing this reintroduces the cryptography<49 ceiling that
# clerk-backend-api pins. It is also not sufficient on its own: the SDK backend
# must be selected explicitly with CLERK_CLIENT_BACKEND = "sdk".
optional-dependencies.sdk = [ "clerk-backend-api>=6.0.1" ]
urls.Changelog = "https://github.com/jmitchel3/django-clerk-users/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/jmitchel3/django-clerk-users"
urls.Issues = "https://github.com/jmitchel3/django-clerk-users/issues"
urls.Repository = "https://github.com/jmitchel3/django-clerk-users"

[dependency-groups]
dev = [
  # Kept in dev so the suite can exercise the [sdk] backend even though the
  # SDK is no longer a runtime dependency.
  "clerk-backend-api>=6.0.1",
  "packaging>=24",
  "pip>=25.3",
  "pre-commit>=4.4",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-django>=4.9",
  "python-dotenv>=1",
  "rav>=0.1.1",
  # Pinned to the 0.14 line: ruff 0.15 widened its default rule set, which
  # flags ~184 pre-existing findings across src/ and migrations. Widening the
  # lint surface is its own change, not a dependency bump.
  "ruff>=0.14.1,<0.15",
  "tox>=4.32",
  "tox-uv>=1.29",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/django_clerk_users" ]

[tool.black]
line-length = 88
target-version = [ 'py312' ]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [ "src", "." ]
testpaths = [ "tests" ]
addopts = "--reuse-db"

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = [ "django_clerk_users" ]
omit = [ "*/tests/*" ]

[tool.coverage.paths]
source = [
  "src/django_clerk_users",
  ".tox/*/lib/python*/site-packages/django_clerk_users",
  ".tox/*/Lib/site-packages/django_clerk_users",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    py312-django42
    py312-django52
    py312-django52-drf
    py312-django60
    py313-django42
    py313-django52
    py313-django60
    py314-django42
    py314-django52
    py314-django60
    py313-sdk
    py313-cryptolatest

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    coverage[toml]>=7.6
    django42: django>=4.2,<5.0
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
    pytest>=8.3
    pytest-django>=4.9
extras =
    drf: drf
    sdk: sdk
set_env =
    !drf: DJANGO_CLERK_USERS_REQUIRE_WHEEL_IMPORT = 1
allowlist_externals =
    cryptolatest: uv
commands_pre =
    cryptolatest: uv pip install --python {envpython} --no-deps --upgrade cryptography
commands =
    !drf: coverage run --data-file=.coverage.{envname} -m pytest -o pythonpath= {posargs}
    drf: coverage run --data-file=.coverage.{envname} -m pytest -o pythonpath= tests/test_drf.py tests/test_drf_combined.py {posargs}
    !drf: coverage report --data-file=.coverage.{envname} --include="src/django_clerk_users/*"
    drf: coverage report --data-file=.coverage.{envname} --include="src/django_clerk_users/*" --fail-under=0
"""
