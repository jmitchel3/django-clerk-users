[build-system]
build-backend = "hatchling.build"

requires = [ "hatchling" ]

[project]
name = "django-clerk-users"
version = "0.3.4"
description = "Integrate Clerk with Django"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Justin Mitchel" },
]
keywords = [ "authentication", "clerk", "django", "jwt", "webhooks" ]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "clerk-backend-api>=6.0.1",
  "cryptography>=45",
  "django>=4.2,<7.0",
  "svix>=1",
]

optional-dependencies.drf = [ "djangorestframework>=3.14" ]
urls.Changelog = "https://github.com/jmitchel3/django-clerk-users/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/jmitchel3/django-clerk-users"
urls.Issues = "https://github.com/jmitchel3/django-clerk-users/issues"
urls.Repository = "https://github.com/jmitchel3/django-clerk-users"

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/django_clerk_users" ]

[dependency-groups]
dev = [
  "pip>=25.3",
  "pre-commit>=4.4",
  "pytest>=9",
  "pytest-cov>=7.0.0",
  "pytest-django>=4.9",
  "python-dotenv>=1",
  "rav>=0.1.1",
  "ruff>=0.14.1",
  "tox>=4.32",
  "tox-uv>=1.29",
]

[tool.black]
line-length = 88
target-version = [ 'py312' ]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [ "src", "." ]
testpaths = [ "tests" ]
addopts = "--reuse-db"

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = [ "django_clerk_users" ]
omit = [ "*/tests/*" ]

[tool.coverage.paths]
source = [
  "src/django_clerk_users",
  ".tox/*/lib/python*/site-packages/django_clerk_users",
  ".tox/*/Lib/site-packages/django_clerk_users",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    py312-django42
    py312-django52
    py312-django52-drf
    py312-django60
    py313-django42
    py313-django52
    py313-django60
    py314-django42
    py314-django52
    py314-django60

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    coverage[toml]>=7.6
    django42: django>=4.2,<5.0
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
    pytest>=8.3
    pytest-django>=4.9
extras =
    drf: drf
set_env =
    !drf: DJANGO_CLERK_USERS_REQUIRE_WHEEL_IMPORT = 1
commands =
    !drf: coverage run --data-file=.coverage.{envname} -m pytest -o pythonpath= {posargs}
    drf: coverage run --data-file=.coverage.{envname} -m pytest -o pythonpath= tests/test_drf.py tests/test_drf_combined.py {posargs}
    !drf: coverage report --data-file=.coverage.{envname} --include="src/django_clerk_users/*"
    drf: coverage report --data-file=.coverage.{envname} --include="src/django_clerk_users/*" --fail-under=0
"""
