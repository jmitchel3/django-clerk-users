name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
        save-cache: false

    - name: Install dependencies
      run: uv sync --group dev --frozen

    - name: Run tox targets for ${{ matrix.python-version }}
      run: uv run tox run -f py$(echo ${{ matrix.python-version }} | tr -d .)

  release:
    needs: [tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Check lockfile
        run: uv lock --check

      - name: Check dependency consistency
        run: uv run python -m pip check

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: uv run python -m django makemigrations --check --dry-run

      - name: Build
        run: uv build

      - name: Check distribution artifacts
        run: uv run python scripts/check_dist.py

      - name: Smoke test installed wheel
        run: |
          uv run --no-sync python -m pip install --force-reinstall --no-deps dist/django_clerk_users-*.whl
          uv run --no-sync python scripts/smoke_installed_wheel.py

      - name: Live Clerk smoke test
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_KEY: ${{ secrets.CLERK_WEBHOOK_SIGNING_KEY }}
          CLERK_FRONTEND_HOSTS: ${{ vars.CLERK_FRONTEND_HOSTS }}
          CLERK_LIVE_SMOKE_LOOKUP_EMAIL: ${{ vars.CLERK_LIVE_SMOKE_LOOKUP_EMAIL }}
        run: uv run --no-sync python scripts/live_clerk_smoke.py --allow-missing-env

      - uses: pypa/gh-action-pypi-publish@release/v1
