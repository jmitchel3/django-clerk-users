name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - 'src/**'
    - 'tests/**'
    - 'scripts/**'
    - '.env.example'
    - 'CHANGELOG.md'
    - 'LICENSE'
    - 'README.md'
    - 'pyproject.toml'
    - 'tox.ini'
    - 'uv.lock'
    - '.github/workflows/ci.yaml'
    - '.github/workflows/live-smoke.yaml'
    - '.github/workflows/release.yaml'
  pull_request:
    paths:
    - 'src/**'
    - 'tests/**'
    - 'scripts/**'
    - '.env.example'
    - 'CHANGELOG.md'
    - 'LICENSE'
    - 'README.md'
    - 'pyproject.toml'
    - 'tox.ini'
    - 'uv.lock'
    - '.github/workflows/ci.yaml'
    - '.github/workflows/live-smoke.yaml'
    - '.github/workflows/release.yaml'

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --group dev --frozen

    - name: Check lockfile
      run: uv lock --check

    - name: Check dependency consistency
      run: uv run python -m pip check

    - name: Run Ruff
      run: uv run ruff check .

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Check migrations
      env:
        DJANGO_SETTINGS_MODULE: tests.settings
      run: uv run python -m django makemigrations --check --dry-run

    - name: Build package
      run: uv build

    - name: Check distribution artifacts
      run: uv run python scripts/check_dist.py

    - name: Smoke test installed wheel
      run: |
        uv run --no-sync python -m pip install --force-reinstall --no-deps dist/django_clerk_users-*.whl
        uv run --no-sync python scripts/smoke_installed_wheel.py

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --group dev --frozen

    - name: Run tox targets for ${{ matrix.python-version }}
      run: uv run tox run -f py$(echo ${{ matrix.python-version }} | tr -d .)

    - name: Upload coverage data
      uses: actions/upload-artifact@v7
      with:
        name: coverage-data-${{ matrix.python-version }}
        path: '${{ github.workspace }}/.coverage.*'
        include-hidden-files: true
        if-no-files-found: warn

  install-shapes:
    name: Install shape (${{ matrix.shape }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
        - shape: base
          extras: ''
        - shape: sdk
          extras: '[sdk]'

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Build wheel
      timeout-minutes: 5
      run: uv build

    - name: Install the wheel with ${{ matrix.shape }} extras
      timeout-minutes: 5
      run: |
        uv venv .shape-venv
        uv pip install --python .shape-venv \
          "$(echo dist/django_clerk_users-*.whl)${{ matrix.extras }}"
        uv pip install --python .shape-venv pytest pytest-django

    - name: Assert clerk-backend-api presence matches the install shape
      timeout-minutes: 5
      env:
        SHAPE: ${{ matrix.shape }}
      run: |
        .shape-venv/bin/python - <<'PY'
        import os, importlib.util, sys
        shape = os.environ["SHAPE"]
        installed = importlib.util.find_spec("clerk_backend_api") is not None
        if shape == "base" and installed:
            sys.exit("clerk-backend-api leaked into a base install")
        if shape == "sdk" and not installed:
            sys.exit("clerk-backend-api missing from an [sdk] install")
        print(f"{shape}: clerk-backend-api installed={installed}")
        PY

    - name: Run the suite against the installed wheel
      timeout-minutes: 10
      env:
        DJANGO_SETTINGS_MODULE: tests.settings
      run: .shape-venv/bin/python -m pytest -o pythonpath= -q

  cryptolatest-base:
    name: Cryptolatest on a base install
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      timeout-minutes: 5
      run: uv sync --group dev --frozen

    # The point of moving clerk-backend-api to an extra: with no SDK in the
    # base install, nothing caps cryptography, so the newest release installs.
    - name: Run cryptolatest against a base install
      timeout-minutes: 10
      run: uv run tox -e py313-cryptolatest

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Download data
        uses: actions/download-artifact@v8
        with:
          path: ${{ github.workspace }}
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage and enforce threshold
        run: |
          uv run coverage combine
          uv run coverage html --skip-covered --skip-empty
          echo "## Coverage summary" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown --fail-under=0 >> $GITHUB_STEP_SUMMARY
          uv run coverage report

      - name: Upload HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: htmlcov
