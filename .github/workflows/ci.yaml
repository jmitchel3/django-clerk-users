name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - 'src/**'
    - 'tests/**'
    - 'scripts/**'
    - '.env.example'
    - 'CHANGELOG.md'
    - 'LICENSE'
    - 'README.md'
    - 'pyproject.toml'
    - 'tox.ini'
    - 'uv.lock'
    - '.github/workflows/ci.yaml'
    - '.github/workflows/live-smoke.yaml'
    - '.github/workflows/release.yaml'
  pull_request:
    paths:
    - 'src/**'
    - 'tests/**'
    - 'scripts/**'
    - '.env.example'
    - 'CHANGELOG.md'
    - 'LICENSE'
    - 'README.md'
    - 'pyproject.toml'
    - 'tox.ini'
    - 'uv.lock'
    - '.github/workflows/ci.yaml'
    - '.github/workflows/live-smoke.yaml'
    - '.github/workflows/release.yaml'

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --group dev --frozen

    - name: Check lockfile
      run: uv lock --check

    - name: Check dependency consistency
      run: uv run python -m pip check

    - name: Run Ruff
      run: uv run ruff check .

    - name: Check formatting
      run: uv run ruff format --check .

    - name: Check migrations
      env:
        DJANGO_SETTINGS_MODULE: tests.settings
      run: uv run python -m django makemigrations --check --dry-run

    - name: Build package
      run: uv build

    - name: Check distribution artifacts
      run: uv run python scripts/check_dist.py

    - name: Smoke test installed wheel
      run: |
        uv run --no-sync python -m pip install --force-reinstall --no-deps dist/django_clerk_users-*.whl
        uv run --no-sync python scripts/smoke_installed_wheel.py

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --group dev --frozen

    - name: Run tox targets for ${{ matrix.python-version }}
      run: uv run tox run -f py$(echo ${{ matrix.python-version }} | tr -d .)

    - name: Upload coverage data
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data-${{ matrix.python-version }}
        path: '${{ github.workspace }}/.coverage.*'
        include-hidden-files: true
        if-no-files-found: warn

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Download data
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage and enforce threshold
        run: |
          uv run coverage combine
          uv run coverage html --skip-covered --skip-empty
          echo "## Coverage summary" >> $GITHUB_STEP_SUMMARY
          uv run coverage report --format=markdown --fail-under=0 >> $GITHUB_STEP_SUMMARY
          uv run coverage report

      - name: Upload HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: htmlcov
